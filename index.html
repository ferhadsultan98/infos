<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aiprompt | High-End Multimedia AI Gallery</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400&family=Inter:wght@300;400;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg: #050508;
            --surface: rgba(255, 255, 255, 0.04);
            --border: rgba(255, 255, 255, 0.1);
            --primary: #00f2ea;
            --secondary: #ff0055;
            --text: #ffffff;
            --text-muted: #8b9bb4;
            --glass: rgba(10, 10, 15, 0.85);
        }

        body.light-mode {
            --bg: #f0f2f5;
            --surface: #ffffff;
            --border: #d1d5db;
            --primary: #2563eb;
            --text: #111827;
            --text-muted: #6b7280;
            --glass: rgba(255, 255, 255, 0.9);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; transition: 0.3s; overflow-x: hidden; }

        /* --- NAVIGATION --- */
        nav {
            position: fixed; top: 0; width: 100%; height: 75px;
            background: var(--glass); backdrop-filter: blur(15px);
            border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 5%; z-index: 1000;
        }
        .logo { font-family: 'Space Grotesk'; font-size: 1.6rem; font-weight: 700; cursor: pointer; }
        .logo span { color: var(--primary); }

        .nav-links { display: flex; gap: 20px; list-style: none; }
        .nav-link { color: var(--text-muted); text-decoration: none; cursor: pointer; font-size: 0.9rem; font-weight: 500; }
        .nav-link.active { color: var(--primary); }

        .user-profile { display: none; align-items: center; gap: 12px; }
        .avatar { width: 35px; height: 35px; border-radius: 50%; background: var(--primary); border: 2px solid var(--border); }

        /* --- CATEGORY SCROLL --- */
        .category-wrapper {
            display: flex; gap: 12px; overflow-x: auto; padding: 10px 0;
            scrollbar-width: none; -ms-overflow-style: none;
            margin-bottom: 20px;
        }
        .category-wrapper::-webkit-scrollbar { display: none; }
        .cat-btn {
            white-space: nowrap; padding: 8px 18px; border-radius: 50px;
            background: var(--surface); border: 1px solid var(--border);
            color: var(--text-muted); cursor: pointer; font-size: 0.85rem; transition: 0.3s;
        }
        .cat-btn.active { background: var(--primary); color: #000; border-color: var(--primary); }

        /* --- GRID & PAGINATION --- */
        .container { margin-top: 100px; padding: 0 5% 50px; }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 25px; }

        .card { 
            background: var(--surface); border: 1px solid var(--border); border-radius: 15px; 
            overflow: hidden; cursor: pointer; transition: 0.3s; position: relative;
        }
        .card:hover { transform: translateY(-5px); border-color: var(--primary); }
        .media-box { width: 100%; aspect-ratio: 16/10; position: relative; background: #000; }
        .media-box img, .media-box video { width: 100%; height: 100%; object-fit: cover; }
        .video-badge { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.6); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; }
        
        .pagination { display: flex; justify-content: center; gap: 10px; margin-top: 40px; }
        .page-btn { padding: 8px 16px; border-radius: 6px; border: 1px solid var(--border); background: var(--surface); color: var(--text); cursor: pointer; }

        /* --- UI ELEMENTS --- */
        .btn-google { background: var(--text); color: var(--bg); padding: 10px 20px; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 8px; }
        .input-group { margin-bottom: 20px; }
        .input-group label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: var(--text-muted); }
        .select, .input, .textarea { width: 100%; padding: 12px; background: var(--surface); border: 1px solid var(--border); color: var(--text); border-radius: 8px; outline: none; }
        
        /* --- DETAILS --- */
        .details-grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 40px; margin-top: 20px; }
        .details-media { border-radius: 12px; overflow: hidden; border: 1px solid var(--border); }
        .prompt-box { background: var(--surface); padding: 20px; border-radius: 10px; font-family: 'Fira Code'; margin-top: 20px; max-height: 250px; overflow-y: auto; }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        @media (max-width: 900px) {
            .details-grid { grid-template-columns: 1fr; }
            .nav-links { display: none; }
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo" onclick="app.nav('home')">Ai<span>prompt</span></div>
        <ul class="nav-links">
            <li onclick="app.nav('home')" class="nav-link active">Home</li>
            <li onclick="app.nav('images')" class="nav-link">Images</li>
            <li onclick="app.nav('videos')" class="nav-link">Videos</li>
            <li onclick="app.nav('bookmarks')" class="nav-link">Bookmarks</li>
        </ul>
        <div style="display: flex; align-items: center; gap: 20px;">
            <div onclick="app.toggleTheme()" style="cursor:pointer"><i class="fas fa-adjust"></i></div>
            <button id="signInBtn" class="btn-google" onclick="app.login()">Sign In</button>
            <div id="userProfile" class="user-profile" onclick="app.nav('settings')">
                <span style="font-size: 0.8rem; font-weight: 600;">Example User</span>
                <div class="avatar"></div>
            </div>
        </div>
    </nav>

    <div class="container">
        
        <section id="home" class="section active">
            <h1 style="text-align:center; font-family:'Space Grotesk'; font-size:3rem;">Infinite <span style="color:var(--primary)">Possibilities</span></h1>
            <div class="grid" id="home-grid" style="margin-top:50px;"></div>
        </section>

        <section id="images" class="section">
            <div class="category-wrapper" id="image-cats"></div>
            <div class="grid" id="image-grid"></div>
            <div class="pagination"><button class="page-btn">1</button><button class="page-btn">2</button></div>
        </section>

        <section id="videos" class="section">
            <div class="category-wrapper" id="video-cats"></div>
            <div class="grid" id="video-grid"></div>
            <div class="pagination"><button class="page-btn">1</button></div>
        </section>

        <section id="upload" class="section">
            <h2>Submit Content</h2>
            <div style="max-width: 600px; margin: 30px auto; background: var(--surface); padding: 30px; border-radius: 15px;">
                <div class="input-group">
                    <label>Content Type</label>
                    <select class="select" id="up-type">
                        <option value="image">Image</option>
                        <option value="video">Video</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Category</label>
                    <select class="select" id="up-cat">
                        <option>Realistic</option><option>Abstract</option><option>Cyberpunk</option><option>Fantasy</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Prompt</label>
                    <textarea class="textarea" id="up-prompt" rows="5"></textarea>
                </div>
                <button class="btn-google" style="width:100%; justify-content:center" onclick="app.submitUpload()">Upload Now</button>
            </div>
        </section>

        <section id="details" class="section">
            <div class="details-grid">
                <div class="details-media" id="det-media-box"></div>
                <div>
                    <h2 id="det-user">@username</h2>
                    <div class="prompt-box" id="det-prompt"></div>
                    <div style="display:flex; gap:10px; margin-top:20px;">
                        <button class="btn-google" onclick="app.copyPrompt()"><i class="fas fa-copy"></i> Copy</button>
                        <button class="btn-google" id="heartBtn" style="background:var(--surface); color:var(--text)" onclick="app.toggleLike()">
                            <i class="fas fa-heart"></i>
                        </button>
                    </div>
                </div>
            </div>
        </section>

        <section id="settings" class="section"><h2>User Settings</h2><p>Manage your profile and API keys.</p></section>
        <section id="bookmarks" class="section"><h2>Bookmarks</h2><div class="grid" id="bookmark-grid"></div></section>
    </div>

    <footer style="margin-top:100px; padding:50px 5%; border-top:1px solid var(--border); text-align:center; color:var(--text-muted)">
        <div style="display:flex; justify-content:center; gap:30px; margin-bottom:20px;">
            <a onclick="app.nav('about')" style="cursor:pointer">About</a>
            <a onclick="app.nav('upload')" style="cursor:pointer">Upload</a>
            <a onclick="app.nav('contact')" style="cursor:pointer">Contact</a>
        </div>
        <p>© 2026 Designed by <a href="https://farhadsultanov.info" target="_blank" style="color:var(--primary); text-decoration:none">Farhad Sultanov</a></p>
    </footer>

    <script>
        const categories = ["All", "Realistic", "Abstract", "Cyberpunk", "Fantasy", "Architecture", "Character", "Anime"];
        
        const db = {
            images: [
                { id: 1, type: 'image', cat: 'Cyberpunk', user: '@axl_rose', url: 'https://images.unsplash.com/photo-1614728263952-84ea256f9679?auto=format&fit=crop&w=600', prompt: 'Cyberpunk rainy street, neon lights, 8k render.' },
                { id: 2, type: 'image', cat: 'Realistic', user: '@nature_pro', url: 'https://images.unsplash.com/photo-1541963463532-d68292c34b19?auto=format&fit=crop&w=600', prompt: 'Portrait of a lion, golden hour lighting, hyper realistic.' },
            ],
            videos: [
                { id: 101, type: 'video', cat: 'Abstract', user: '@motion_art', url: 'https://assets.mixkit.co/videos/preview/mixkit-liquid-bubbles-and-smoke-underwater-431-large.mp4', prompt: 'Abstract liquid bubbles underwater, slow motion.' },
                { id: 102, type: 'video', cat: 'Fantasy', user: '@dragon_lord', url: 'https://assets.mixkit.co/videos/preview/mixkit-clouds-and-stars-at-night-2442-large.mp4', prompt: 'Starry night sky with fast moving clouds, fantasy style.' }
            ]
        };

        const app = {
            isLoggedIn: false,
            currentView: 'home',
            activeItem: null,

            init() {
                this.renderCategories('image-cats');
                this.renderCategories('video-cats');
                this.renderGrid('home-grid', [...db.images, ...db.videos]);
                this.renderGrid('image-grid', db.images);
                this.renderGrid('video-grid', db.videos);
            },

            nav(id) {
                document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
                document.getElementById(id).classList.add('active');
                document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
                window.scrollTo(0,0);
            },

            renderCategories(id) {
                const cont = document.getElementById(id);
                cont.innerHTML = categories.map(c => `<button class="cat-btn ${c==='All'?'active':''}" onclick="app.filterCat('${c}')">${c}</button>`).join('');
            },

            renderGrid(id, data) {
                const cont = document.getElementById(id);
                cont.innerHTML = data.map(item => `
                    <div class="card" onclick="app.openDetail(${item.id}, '${item.type}')">
                        <div class="media-box">
                            ${item.type === 'video' ? `<span class="video-badge"><i class="fas fa-play"></i> Video</span><video src="${item.url}" muted onmouseover="this.play()" onmouseout="this.pause()"></video>` : `<img src="${item.url}">`}
                        </div>
                        <div style="padding:15px;">
                            <div style="font-size:0.8rem; color:var(--text-muted); font-family:'Fira Code'; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">${item.prompt}</div>
                            <div style="margin-top:10px; font-weight:600; font-size:0.85rem; display:flex; justify-content:space-between;">
                                <span>${item.user}</span>
                                <span style="color:var(--primary)">${item.cat}</span>
                            </div>
                        </div>
                    </div>
                `).join('');
            },

            openDetail(id, type) {
                const source = type === 'image' ? db.images : db.videos;
                const item = source.find(x => x.id === id);
                this.activeItem = item;

                const mediaCont = document.getElementById('det-media-box');
                mediaCont.innerHTML = item.type === 'video' ? `<video src="${item.url}" controls autoplay loop></video>` : `<img src="${item.url}">`;
                
                document.getElementById('det-user').innerText = item.user;
                document.getElementById('det-prompt').innerText = item.prompt;
                
                this.nav('details');
            },

            login() {
                this.isLoggedIn = true;
                document.getElementById('signInBtn').style.display = 'none';
                document.getElementById('userProfile').style.display = 'flex';
                alert("Welcome, Example User!");
            },

            submitUpload() {
                if(!this.isLoggedIn) return alert("Please sign in to upload!");
                alert("Upload submitted! Our team will review your prompt.");
            },

            toggleLike() {
                if(!this.isLoggedIn) return alert("Sign in to save prompts to bookmarks!");
                const btn = document.getElementById('heartBtn');
                btn.style.color = btn.style.color === 'var(--secondary)' ? 'var(--text)' : 'var(--secondary)';
            },

            copyPrompt() {
                const text = document.getElementById('det-prompt').innerText;
                navigator.clipboard.writeText(text);
                alert("Prompt copied to clipboard!");
            },

            toggleTheme() {
                document.body.classList.toggle('light-mode');
            },

            toggleMenu() {
                // Mobile menu logic
            }
        };

        app.init();
    </script>
</body>
</html>
